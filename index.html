<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0f1d">
  <link rel="manifest" href="manifest.json">
  <title>B.O.U Lounge 2026-2027</title>
  <style>
    :root {
      --bg: #0a0f1d;
      --panel: #111827;
      --panel-header: #0d1527;
      --border-color: #1f2937;
      --text-primary: #ffffff;
      --text-secondary: #94a3b8;
      --accent-blue: #00d2ff;
      --accent-primary: #2563eb;
      --msg-out: linear-gradient(135deg, #2563eb, #00d2ff);
      --msg-in: #1e293b;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #060911;
      color: var(--text-primary);
      overflow: hidden;
    }

    /* App Main Container */
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      width: 100vw;
      max-width: 850px;
      margin: 0 auto;
      background: var(--bg);
      position: relative;
    }

    @media (min-width: 850px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #04060c;
      }
      .app-container {
        height: 95vh;
        border-radius: 16px;
        border: 1px solid var(--border-color);
        box-shadow: 0 12px 32px rgba(0, 210, 255, 0.05);
        overflow: hidden;
      }
    }

    /* Header Bar */
    .app-header {
      height: 60px;
      background: var(--panel-header);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
      z-index: 10;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .group-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--accent-primary);
      display: grid;
      place-items: center;
      font-size: 18px;
      flex-shrink: 0;
      box-shadow: 0 0 12px rgba(37, 99, 235, 0.4);
    }

    .group-details .title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .group-details .subtitle {
      font-size: 11px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      display: inline-block;
      box-shadow: 0 0 8px var(--success);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-install {
      background: var(--accent-primary);
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn-install:hover { background: #1d4ed8; }
    .btn-install:active { transform: scale(0.95); }

    .user-profile-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #1e293b;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid var(--accent-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      font-size: 13px;
      flex-shrink: 0;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .user-profile-btn:hover {
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
    }

    .user-profile-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Navigation Tabs Bar */
    .nav-tabs-bar {
      display: flex;
      background: #0d1527;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .nav-tab-btn {
      flex: 1;
      padding: 12px 10px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-bottom: 3px solid transparent;
      transition: all 0.2s ease;
    }

    .nav-tab-btn.active {
      color: var(--accent-blue);
      border-bottom-color: var(--accent-blue);
      background: rgba(0, 210, 255, 0.06);
    }

    /* Content Display Areas */
    .content-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Public Chat Area */
    .message-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    .message-area::-webkit-scrollbar, .notice-feed::-webkit-scrollbar { width: 6px; }
    .message-area::-webkit-scrollbar-thumb, .notice-feed::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }

    /* Message Bubbles */
    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 85%;
    }

    .msg-row.sent {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-row.received {
      align-self: flex-start;
    }

    .msg-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #1e293b;
      object-fit: cover;
      flex-shrink: 0;
      font-size: 11px;
      display: grid;
      place-items: center;
      font-weight: bold;
      color: #fff;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .msg-content-wrapper {
      display: flex;
      flex-direction: column;
    }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
      position: relative;
    }

    .msg-row.sent .msg-bubble {
      background: var(--msg-out);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .msg-row.received .msg-bubble {
      background: var(--msg-in);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px;
    }

    .msg-sender {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 3px;
      padding-left: 2px;
    }

    .msg-row.sent .msg-sender {
      text-align: right;
      padding-right: 2px;
    }

    .msg-img {
      max-width: 100%;
      max-height: 280px;
      border-radius: 14px;
      margin-top: 4px;
      display: block;
      cursor: pointer;
      object-fit: cover;
    }

    .msg-time {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 4px;
      text-align: right;
    }

    /* Footer Chat Inputs & Guest Notice */
    .chat-footer {
      background: var(--panel-header);
      padding: 10px 14px;
      border-top: 1px solid var(--border-color);
      flex-shrink: 0;
      position: relative;
    }

    .footer-inputs {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-footer input[type="text"] {
      flex: 1;
      height: 42px;
      background: #1e293b;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 0 16px;
      color: var(--text-primary);
      font-size: 16px;
      user-select: text;
    }

    .chat-footer input[type="text"]:focus {
      border-color: var(--accent-blue);
      outline: none;
    }

    .chat-footer input[type="text"]::placeholder {
      color: var(--text-secondary);
    }

    .btn-icon {
      background: transparent;
      color: var(--accent-blue);
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 20px;
      transition: background 0.2s;
    }

    .btn-icon:hover { background: rgba(255, 255, 255, 0.08); }

    .btn-send {
      background: var(--accent-primary);
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .btn-send:hover { background: #1d4ed8; }
    .btn-send:active { transform: scale(0.9); }

    .guest-notice-bar {
      background: #111827;
      padding: 8px 12px;
      border-radius: 12px;
      text-align: center;
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid var(--border-color);
      margin-top: 6px;
    }

    .btn-guest-login {
      background: var(--accent-primary);
      color: white;
      border: none;
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Notice Board Section */
    .notice-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 16px;
    }

    .notice-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .btn-admin-add {
      background: var(--accent-primary);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s ease;
    }

    .btn-admin-add:hover { background: #1d4ed8; }

    .notice-feed {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .notice-card {
      background: var(--panel);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      position: relative;
    }

    .notice-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .notice-badge {
      background: rgba(0, 210, 255, 0.15);
      color: var(--accent-blue);
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      border: 1px solid rgba(0, 210, 255, 0.3);
    }

    .notice-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .notice-body {
      font-size: 14px;
      color: #cbd5e1;
      line-height: 1.5;
      white-space: pre-line;
      word-break: break-word;
    }

    .notice-img {
      width: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 10px;
      cursor: pointer;
      border: 1px solid var(--border-color);
    }

    .notice-time {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 10px;
    }

    .btn-notice-delete {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s ease;
    }

    .btn-notice-delete:hover { background: rgba(239, 68, 68, 0.3); }

    /* Emoji Picker Box */
    .emoji-picker {
      position: absolute;
      bottom: 65px;
      left: 14px;
      background: var(--panel);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      z-index: 50;
      max-width: 310px;
    }

    .emoji-btn {
      background: transparent;
      border: none;
      font-size: 20px;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
    }
    .emoji-btn:hover { background: rgba(255, 255, 255, 0.1); }

    /* Zoomable Lightbox Modal System */
    .lightbox-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(4, 6, 12, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 300;
      overflow: hidden;
      touch-action: none;
    }

    .lightbox-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .lightbox-img {
      max-width: 90%;
      max-height: 85vh;
      object-fit: contain;
      transition: transform 0.1s ease-out;
      transform-origin: center center;
      cursor: grab;
    }

    .lightbox-controls {
      position: absolute;
      bottom: 20px;
      display: flex;
      gap: 12px;
      background: rgba(17, 24, 39, 0.85);
      padding: 8px 16px;
      border-radius: 30px;
      border: 1px solid var(--border-color);
      z-index: 310;
    }

    .zoom-btn {
      background: #1e293b;
      color: white;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .lightbox-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: none;
      font-size: 22px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      z-index: 310;
    }

    /* Modals & Popups */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 20px;
    }

    .hidden { display: none !important; }

    .modal-card {
      background: var(--panel);
      width: 100%;
      max-width: 380px;
      padding: 22px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 12px 32px rgba(0,0,0,0.8);
      position: relative;
    }

    .modal-close-btn {
      position: absolute;
      top: 12px;
      right: 14px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 22px;
      cursor: pointer;
    }

    .modal-card h3 {
      font-size: 18px;
      margin-bottom: 14px;
      color: var(--text-primary);
      text-align: center;
    }

    .auth-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 8px;
      font-weight: 600;
      font-size: 14px;
      color: var(--text-secondary);
      cursor: pointer;
      border-radius: 8px;
    }

    .auth-tab.active {
      color: var(--accent-blue);
      background: rgba(0, 210, 255, 0.12);
    }

    .avatar-upload-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 14px;
      gap: 8px;
    }

    .avatar-preview {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: #1e293b;
      object-fit: cover;
      border: 2px solid var(--accent-blue);
    }

    .btn-upload-pic {
      font-size: 12px;
      color: var(--accent-blue);
      cursor: pointer;
      font-weight: 600;
    }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
    .form-group input, .form-group textarea {
      width: 100%; background: #1e293b; border: 1px solid var(--border-color);
      border-radius: 8px; padding: 10px 12px; color: white; outline: none; font-size: 16px;
      user-select: text; font-family: inherit;
    }
    .form-group input:focus, .form-group textarea:focus {
      border-color: var(--accent-blue);
    }

    .btn-primary {
      width: 100%; height: 40px; background: var(--accent-primary);
      border: none; color: white; font-weight: 700; border-radius: 8px; cursor: pointer; margin-top: 8px; font-size: 14px;
      transition: background 0.2s ease;
    }

    .btn-primary:hover { background: #1d4ed8; }

    .btn-danger {
      width: 100%; height: 38px; background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger);
      color: var(--danger); font-weight: 700; border-radius: 8px; cursor: pointer; margin-top: 8px; font-size: 13px;
    }

    .status-msg { font-size: 12px; text-align: center; margin-top: 8px; min-height: 16px; }
    .status-msg.error { color: var(--danger); }
    .status-msg.info { color: var(--success); }

    /* Loading Overlay */
    .loading-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(4, 6, 12, 0.85);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 250; gap: 12px;
    }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- Global Loading Overlay -->
    <div class="loading-overlay hidden" id="loadingOverlay">
      <div class="spinner"></div>
      <div style="font-size:13px; color:var(--text-primary)" id="loadingText">Processing...</div>
    </div>

    <!-- Lightbox Modal with Pinch Zoom & Pan Controls -->
    <div class="lightbox-overlay hidden" id="lightboxModal">
      <button class="lightbox-close" id="lightboxClose">&times;</button>
      <div class="lightbox-wrapper">
        <img src="" id="lightboxImg" class="lightbox-img" alt="Zoomable View" />
      </div>
      <div class="lightbox-controls">
        <button class="zoom-btn" id="zoomOutBtn" title="Zoom Out">-</button>
        <button class="zoom-btn" id="zoomResetBtn" title="Reset Zoom" style="font-size: 12px;">↺</button>
        <button class="zoom-btn" id="zoomInBtn" title="Zoom In">+</button>
      </div>
    </div>

    <!-- App Header Section -->
    <header class="app-header">
      <div class="brand-section">
        <div class="group-avatar">🎓</div>
        <div class="group-details">
          <div class="title">B.O.U First Year 2026-2027</div>
          <div class="subtitle"><span class="status-dot"></span> Official Lounge</div>
        </div>
      </div>
      <div class="header-actions">
        <!-- Direct File Download App Button -->
        <button id="downloadAppBtn" class="btn-install" title="Download HTML File">📥 App Download</button>
        <!-- Install App Button for PWA -->
        <button id="installAppBtn" class="btn-install hidden">📲 Install App</button>
        <div class="user-profile-btn" id="profileBtn" title="User Profile">
          <span id="userInitials">GST</span>
        </div>
      </div>
    </header>

    <!-- Top Navigation Tabs Bar -->
    <nav class="nav-tabs-bar">
      <button class="nav-tab-btn active" id="tabPublicChat">💬 Public Chat</button>
      <button class="nav-tab-btn" id="tabNoticeBoard">📢 Notice Board</button>
    </nav>

    <!-- PUBLIC CHAT SECTION -->
    <section class="content-section" id="chatSection">
      <!-- Scrollable Message Area -->
      <main class="message-area" id="messageArea">
        <!-- Messages rendered dynamically -->
      </main>

      <!-- Footer Inputs & Guest Alert Bar -->
      <footer class="chat-footer">
        <!-- Emoji Picker Panel -->
        <div class="emoji-picker hidden" id="emojiPicker">
          <button class="emoji-btn">😀</button>
          <button class="emoji-btn">😂</button>
          <button class="emoji-btn">😍</button>
          <button class="emoji-btn">😎</button>
          <button class="emoji-btn">🔥</button>
          <button class="emoji-btn">👍</button>
          <button class="emoji-btn">❤️</button>
          <button class="emoji-btn">🎉</button>
          <button class="emoji-btn">✨</button>
          <button class="emoji-btn">🚀</button>
          <button class="emoji-btn">💯</button>
          <button class="emoji-btn">🙏</button>
          <button class="emoji-btn">🤔</button>
          <button class="emoji-btn">⚡</button>
        </div>

        <!-- Logged In Users Input Bar -->
        <div class="footer-inputs" id="chatInputBar">
          <input type="file" id="imageInput" accept="image/*" class="hidden" />
          <button class="btn-icon" id="attachBtn" title="Send Photo">📷</button>
          <button class="btn-icon" id="emojiToggleBtn" title="Insert Emoji">😊</button>
          <input type="text" id="messageInput" placeholder="Type a message..." />
          <button class="btn-send" id="sendBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>

        <!-- Guest Users Notice Bar -->
        <div class="guest-notice-bar" id="guestNoticeBar">
          <span>💡 Chatting as Guest. Set your name & profile photo:</span>
          <button class="btn-guest-login" id="guestLoginBtn">Login / Register</button>
        </div>
      </footer>
    </section>

    <!-- NOTICE BOARD SECTION -->
    <section class="content-section hidden" id="noticeSection">
      <div class="notice-container">
        <div class="notice-header-bar">
          <div style="font-weight:700; font-size:15px; color:var(--text-primary)">Official Notices</div>
          <button class="btn-admin-add" id="openAddNoticeBtn">➕ Add Notice</button>
        </div>

        <div class="notice-feed" id="noticeFeed">
          <!-- Notices rendered dynamically -->
        </div>
      </div>
    </section>

    <!-- Auth & Profile Modal -->
    <div class="modal-overlay hidden" id="authModal">
      <div class="modal-card">
        <button class="modal-close-btn" id="closeModalBtn" type="button">&times;</button>
        
        <div class="auth-tabs" id="authTabs">
          <div class="auth-tab active" id="tabLogin">Sign In</div>
          <div class="auth-tab" id="tabRegister">Register</div>
        </div>

        <h3 id="modalTitle">Sign In to Account</h3>
        <form id="authForm">
          
          <div class="avatar-upload-wrapper" id="avatarSection">
            <img src="https://via.placeholder.com/100?text=Profile" class="avatar-preview" id="avatarPreview" />
            <label for="authAvatarInput" class="btn-upload-pic">📷 Change Profile Photo</label>
            <input type="file" id="authAvatarInput" accept="image/*" class="hidden" />
          </div>

          <div class="form-group" id="nameGroup">
            <label>Full Name</label>
            <input type="text" id="authName" placeholder="e.g. Jubayer Ahmed" />
          </div>

          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="authPhone" required placeholder="017XXXXXXXX" />
          </div>

          <div class="status-msg" id="authStatus"></div>
          <button type="submit" class="btn-primary" id="authSubmitBtn">Sign In</button>
          <button type="button" class="btn-danger hidden" id="logoutBtn">Logout</button>
        </form>
      </div>
    </div>

    <!-- Admin Create Notice Modal -->
    <div class="modal-overlay hidden" id="adminNoticeModal">
      <div class="modal-card">
        <button class="modal-close-btn" id="closeNoticeModalBtn" type="button">&times;</button>
        <h3>📢 Publish New Notice</h3>
        <form id="adminNoticeForm">
          <div class="form-group">
            <label>Notice Title (Optional)</label>
            <input type="text" id="noticeTitleInput" placeholder="e.g. Exam Schedule Released" />
          </div>

          <div class="form-group">
            <label>Notice Details (Optional)</label>
            <textarea id="noticeContentInput" rows="4" placeholder="Write details here..."></textarea>
          </div>

          <div class="form-group">
            <label>Attach Image (Optional)</label>
            <input type="file" id="noticeImageInput" accept="image/*" />
          </div>

          <div class="form-group">
            <label style="color:#ef4444; font-weight:bold;">Admin Password</label>
            <input type="password" id="noticeAdminPassword" required placeholder="Enter password" />
          </div>

          <div class="status-msg" id="noticeAdminStatus"></div>
          <button type="submit" class="btn-primary">Publish Notice</button>
        </form>
      </div>
    </div>

    <!-- Admin Delete Confirmation Modal -->
    <div class="modal-overlay hidden" id="adminDeleteModal">
      <div class="modal-card">
        <button class="modal-close-btn" id="closeDeleteModalBtn" type="button">&times;</button>
        <h3 id="deleteModalTitle">Delete Item (Admin)</h3>
        <p style="font-size:12px; color:var(--text-secondary); text-align:center; margin-bottom:12px;">
          Provide admin password to remove this item.
        </p>
        <div class="form-group">
          <label>Admin Password</label>
          <input type="password" id="adminPasswordInput" placeholder="Enter password" />
        </div>
        <div class="status-msg" id="adminStatus"></div>
        <button type="button" class="btn-danger" id="confirmDeleteBtn">Confirm Delete</button>
      </div>
    </div>

  </div>

  <script>
    // =========================================================================
    // Global Configurations & Local Storage Setup
    // =========================================================================
    const JSONBIN_BIN_ID = "YOUR_BIN_ID_HERE"; 
    const JSONBIN_API_KEY = "YOUR_MASTER_KEY_HERE"; 
    const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;
    const ADMIN_PASSWORD_DEFAULT = "admin123"; 
    const MAX_FILE_SIZE_BYTES = 10 * 1024 * 1024;

    let authMode = 'login';
    let currentUser = null;
    let pendingDeleteTarget = null;
    let tempAvatarBase64 = null;
    let tempNoticeImgBase64 = null;

    let localStoreData = {
      users: [],
      messages: [],
      notices: []
    };

    // =========================================================================
    // Lifecycle Init
    // =========================================================================
    window.addEventListener('DOMContentLoaded', async () => {
      const savedMsgs = localStorage.getItem('bou_chat_messages');
      if (savedMsgs) { try { localStoreData.messages = JSON.parse(savedMsgs); } catch (e) {} }

      const savedNotices = localStorage.getItem('bou_chat_notices');
      if (savedNotices) { try { localStoreData.notices = JSON.parse(savedNotices); } catch (e) {} }

      const savedUsers = localStorage.getItem('bou_chat_users');
      if (savedUsers) { try { localStoreData.users = JSON.parse(savedUsers); } catch (e) {} }

      const savedUser = localStorage.getItem('bou_chat_user');
      if (savedUser) {
        try { currentUser = JSON.parse(savedUser); } catch(e) {}
      }

      // Auto Assign Guest Profile if not logged in so Mobile Chat is ALWAYS usable immediately
      if (!currentUser) {
        currentUser = {
          id: 'usr_guest_' + Math.floor(1000 + Math.random() * 9000),
          name: 'Guest ' + Math.floor(100 + Math.random() * 900),
          phone: '',
          avatar: null,
          isGuest: true
        };
      }

      updateUserUI();
      renderAllMessages();
      renderAllNotices();

      await syncWithJSONBin();
      setInterval(syncWithJSONBin, 3500);
    });

    // =========================================================================
    // Direct HTML App File Download Logic
    // =========================================================================
    const downloadAppBtn = document.getElementById('downloadAppBtn');
    if (downloadAppBtn) {
      downloadAppBtn.addEventListener('click', () => {
        const fullHTML = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
        const blob = new Blob([fullHTML], { type: 'text/html;charset=utf-8' });
        const downloadUrl = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = downloadUrl;
        link.download = 'index.html';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(downloadUrl);
      });
    }

    // =========================================================================
    // Navigation Tabs Switching (Public Chat vs Notice Board)
    // =========================================================================
    const tabPublicChat = document.getElementById('tabPublicChat');
    const tabNoticeBoard = document.getElementById('tabNoticeBoard');
    const chatSection = document.getElementById('chatSection');
    const noticeSection = document.getElementById('noticeSection');

    tabPublicChat.addEventListener('click', () => {
      tabPublicChat.classList.add('active');
      tabNoticeBoard.classList.remove('active');
      chatSection.classList.remove('hidden');
      noticeSection.classList.add('hidden');
      scrollToBottom();
    });

    tabNoticeBoard.addEventListener('click', () => {
      tabNoticeBoard.classList.add('active');
      tabPublicChat.classList.remove('active');
      noticeSection.classList.remove('hidden');
      chatSection.classList.add('hidden');
    });

    // =========================================================================
    // Auth & Guest UI Management
    // =========================================================================
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const nameGroup = document.getElementById('nameGroup');
    const avatarSection = document.getElementById('avatarSection');
    const modalTitle = document.getElementById('modalTitle');
    const authSubmitBtn = document.getElementById('authSubmitBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const authStatus = document.getElementById('authStatus');

    tabLogin.addEventListener('click', () => { if (authMode !== 'profile') setAuthMode('login'); });
    tabRegister.addEventListener('click', () => { if (authMode !== 'profile') setAuthMode('register'); });

    function setAuthMode(mode) {
      authMode = mode;
      authStatus.textContent = '';
      authStatus.className = 'status-msg';

      if (mode === 'login') {
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        nameGroup.style.display = 'none';
        avatarSection.style.display = 'none';
        modalTitle.textContent = 'Sign In to Account';
        authSubmitBtn.textContent = 'Sign In';
        authSubmitBtn.classList.remove('hidden');
        logoutBtn.classList.add('hidden');
        document.getElementById('authName').required = false;
      } else if (mode === 'register') {
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        nameGroup.style.display = 'block';
        avatarSection.style.display = 'flex';
        modalTitle.textContent = 'Create New Account';
        authSubmitBtn.textContent = 'Register';
        authSubmitBtn.classList.remove('hidden');
        logoutBtn.classList.add('hidden');
        document.getElementById('authName').required = true;
      } else if (mode === 'profile') {
        document.getElementById('authTabs').style.display = 'none';
        nameGroup.style.display = 'block';
        avatarSection.style.display = 'flex';
        modalTitle.textContent = 'Profile & Avatar';
        authSubmitBtn.textContent = 'Save Changes';
        authSubmitBtn.classList.remove('hidden');
        logoutBtn.classList.remove('hidden');
      }
    }

    document.getElementById('profileBtn').addEventListener('click', () => {
      if (currentUser && !currentUser.isGuest) {
        document.getElementById('authName').value = currentUser.name || '';
        document.getElementById('authPhone').value = currentUser.phone || '';
        document.getElementById('avatarPreview').src = currentUser.avatar || 'https://via.placeholder.com/100?text=User';
        tempAvatarBase64 = currentUser.avatar || null;
        document.getElementById('authTabs').style.display = 'none';
        setAuthMode('profile');
      } else {
        document.getElementById('authTabs').style.display = 'flex';
        setAuthMode('login');
      }
      showAuthModal();
    });

    document.getElementById('guestLoginBtn').addEventListener('click', () => {
      document.getElementById('authTabs').style.display = 'flex';
      setAuthMode('login');
      showAuthModal();
    });

    document.getElementById('closeModalBtn').addEventListener('click', hideAuthModal);

    document.getElementById('authAvatarInput').addEventListener('change', async function() {
      const file = this.files[0];
      if (!file) return;
      showLoading(true, "Processing image...");
      try {
        tempAvatarBase64 = await compressImage(file, 150, 0.7);
        document.getElementById('avatarPreview').src = tempAvatarBase64;
      } catch (e) {
        alert("Failed to load image.");
      } finally {
        showLoading(false);
      }
    });

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('authName').value.trim();
      const phone = document.getElementById('authPhone').value.trim();

      if (!phone) {
        showStatus('Please enter phone number.', 'error');
        return;
      }

      if (authMode === 'register') {
        const existing = localStoreData.users.find(u => u.phone === phone);
        if (existing) {
          showStatus('Account already exists! Go to Sign In.', 'error');
          return;
        }

        const newUser = {
          id: 'usr_' + Date.now(),
          name: name || 'User',
          phone: phone,
          avatar: tempAvatarBase64 || null,
          isGuest: false
        };

        localStoreData.users.push(newUser);
        currentUser = newUser;
        saveUserData();
        showStatus('Registration successful!', 'info');
        setTimeout(() => { hideAuthModal(); updateUserUI(); renderAllMessages(); }, 600);

      } else if (authMode === 'login') {
        let found = localStoreData.users.find(u => u.phone === phone);
        if (!found) {
          found = {
            id: 'usr_' + Date.now(),
            name: 'User ' + phone.slice(-4),
            phone: phone,
            avatar: null,
            isGuest: false
          };
          localStoreData.users.push(found);
        } else {
          found.isGuest = false;
        }

        currentUser = found;
        saveUserData();
        showStatus('Signed in successfully!', 'info');
        setTimeout(() => { hideAuthModal(); updateUserUI(); renderAllMessages(); }, 600);

      } else if (authMode === 'profile') {
        currentUser.name = name;
        currentUser.phone = phone;
        currentUser.isGuest = false;
        if (tempAvatarBase64) currentUser.avatar = tempAvatarBase64;

        const idx = localStoreData.users.findIndex(u => u.id === currentUser.id);
        if (idx >= 0) localStoreData.users[idx] = currentUser;
        else localStoreData.users.push(currentUser);

        saveUserData();
        showStatus('Profile updated!', 'info');
        setTimeout(() => { hideAuthModal(); updateUserUI(); renderAllMessages(); }, 600);
      }
    });

    logoutBtn.addEventListener('click', () => {
      currentUser = {
        id: 'usr_guest_' + Math.floor(1000 + Math.random() * 9000),
        name: 'Guest ' + Math.floor(100 + Math.random() * 900),
        phone: '',
        avatar: null,
        isGuest: true
      };
      localStorage.removeItem('bou_chat_user');
      updateUserUI();
      document.getElementById('authTabs').style.display = 'flex';
      setAuthMode('login');
      showStatus('Logged out successfully.', 'info');
    });

    function saveUserData() {
      if (currentUser && !currentUser.isGuest) {
        localStorage.setItem('bou_chat_user', JSON.stringify(currentUser));
      }
      localStorage.setItem('bou_chat_users', JSON.stringify(localStoreData.users));
      saveToJSONBin();
    }

    function showStatus(text, type) {
      authStatus.textContent = text;
      authStatus.className = `status-msg ${type}`;
    }

    function updateUserUI() {
      const btn = document.getElementById('profileBtn');
      const chatInputBar = document.getElementById('chatInputBar');
      const guestNoticeBar = document.getElementById('guestNoticeBar');

      // ALWAYS keep chatInputBar visible on Mobile and Desktop!
      chatInputBar.classList.remove('hidden');

      if (!currentUser || currentUser.isGuest) {
        btn.innerHTML = 'GST';
        guestNoticeBar.classList.remove('hidden');
      } else {
        if (currentUser.avatar) {
          btn.innerHTML = `<img src="${currentUser.avatar}" alt="Avatar" />`;
        } else {
          const initials = currentUser.name ? currentUser.name.substring(0, 2).toUpperCase() : 'US';
          btn.innerHTML = initials;
        }
        guestNoticeBar.classList.add('hidden');
      }
    }

    function showAuthModal() { document.getElementById('authModal').classList.remove('hidden'); }
    function hideAuthModal() { document.getElementById('authModal').classList.add('hidden'); }

    // =========================================================================
    // Notice Board Logic (Admin Upload & Admin Delete)
    // =========================================================================
    const adminNoticeModal = document.getElementById('adminNoticeModal');
    const openAddNoticeBtn = document.getElementById('openAddNoticeBtn');

    openAddNoticeBtn.addEventListener('click', () => {
      document.getElementById('noticeTitleInput').value = '';
      document.getElementById('noticeContentInput').value = '';
      document.getElementById('noticeImageInput').value = '';
      document.getElementById('noticeAdminPassword').value = '';
      document.getElementById('noticeAdminStatus').textContent = '';
      tempNoticeImgBase64 = null;
      adminNoticeModal.classList.remove('hidden');
    });

    document.getElementById('closeNoticeModalBtn').addEventListener('click', () => {
      adminNoticeModal.classList.add('hidden');
    });

    document.getElementById('noticeImageInput').addEventListener('change', async function() {
      const file = this.files[0];
      if (!file) return;
      showLoading(true, "Processing notice image...");
      try {
        tempNoticeImgBase64 = await compressImage(file, 500, 0.5);
      } catch (e) {
        alert("Failed to process image.");
      } finally {
        showLoading(false);
      }
    });

    document.getElementById('adminNoticeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      let title = document.getElementById('noticeTitleInput').value.trim();
      const content = document.getElementById('noticeContentInput').value.trim();
      const pass = document.getElementById('noticeAdminPassword').value.trim();
      const statusEl = document.getElementById('noticeAdminStatus');

      if (pass !== ADMIN_PASSWORD_DEFAULT) {
        statusEl.textContent = 'Invalid admin password!';
        statusEl.className = 'status-msg error';
        return;
      }

      if (!title && !content && !tempNoticeImgBase64) {
        statusEl.textContent = 'Please provide title, content, or an image!';
        statusEl.className = 'status-msg error';
        return;
      }

      if (!title) {
        const now = new Date();
        title = 'Notice - ' + now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      }

      const newNotice = {
        id: 'ntc_' + Date.now(),
        title: title,
        content: content,
        image_url: tempNoticeImgBase64,
        created_at: new Date().toISOString()
      };

      if (!localStoreData.notices) localStoreData.notices = [];
      localStoreData.notices.unshift(newNotice);
      localStorage.setItem('bou_chat_notices', JSON.stringify(localStoreData.notices));

      renderAllNotices();
      await saveToJSONBin();

      adminNoticeModal.classList.add('hidden');
      alert("Notice published successfully!");
    });

    function renderAllNotices() {
      const feed = document.getElementById('noticeFeed');
      feed.innerHTML = '';

      if (localStoreData.notices && localStoreData.notices.length > 0) {
        localStoreData.notices.forEach(renderNoticeItem);
      } else {
        feed.innerHTML = '<div style="text-align:center; color:var(--text-secondary); font-size:13px; padding:30px;">No notices published yet.</div>';
      }
    }

    function renderNoticeItem(notice) {
      const feed = document.getElementById('noticeFeed');
      const card = document.createElement('div');
      card.className = 'notice-card';

      const timeStr = notice.created_at ? new Date(notice.created_at).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' }) : '';
      
      let imgHtml = notice.image_url ? `<img src="${notice.image_url}" class="notice-img" onclick="openLightbox('${notice.image_url}')" />` : '';

      card.innerHTML = `
        <div class="notice-card-header">
          <span class="notice-badge">ADMIN NOTICE</span>
          <button class="btn-notice-delete" onclick="triggerNoticeDelete('${notice.id}')">🗑️ Delete</button>
        </div>
        <div class="notice-title">${escapeHtml(notice.title)}</div>
        ${notice.content ? `<div class="notice-body">${escapeHtml(notice.content)}</div>` : ''}
        ${imgHtml}
        <div class="notice-time">Published: ${timeStr}</div>
      `;

      feed.appendChild(card);
    }

    function triggerNoticeDelete(noticeId) {
      pendingDeleteTarget = { type: 'notice', id: noticeId };
      document.getElementById('deleteModalTitle').textContent = 'Delete Notice (Admin)';
      document.getElementById('adminPasswordInput').value = '';
      document.getElementById('adminStatus').textContent = '';
      document.getElementById('adminDeleteModal').classList.remove('hidden');
    }

    // =========================================================================
    // Lightbox System with Pinch Zoom & Dragging
    // =========================================================================
    const lightboxModal = document.getElementById('lightboxModal');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxClose = document.getElementById('lightboxClose');

    let currentScale = 1;
    let translateX = 0, translateY = 0;
    let isDragging = false, startX = 0, startY = 0;
    let initialPinchDistance = null;

    function openLightbox(src) {
      lightboxImg.src = src;
      resetZoom();
      lightboxModal.classList.remove('hidden');
    }

    function resetZoom() {
      currentScale = 1; translateX = 0; translateY = 0;
      applyTransform();
    }

    function applyTransform() {
      lightboxImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentScale})`;
    }

    lightboxClose.addEventListener('click', () => lightboxModal.classList.add('hidden'));

    document.getElementById('zoomInBtn').addEventListener('click', () => {
      currentScale = Math.min(currentScale + 0.4, 5);
      applyTransform();
    });

    document.getElementById('zoomOutBtn').addEventListener('click', () => {
      currentScale = Math.max(currentScale - 0.4, 1);
      if (currentScale === 1) { translateX = 0; translateY = 0; }
      applyTransform();
    });

    document.getElementById('zoomResetBtn').addEventListener('click', resetZoom);

    lightboxModal.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.deltaY < 0) currentScale = Math.min(currentScale + 0.25, 5);
      else currentScale = Math.max(currentScale - 0.25, 1);
      if (currentScale === 1) { translateX = 0; translateY = 0; }
      applyTransform();
    }, { passive: false });

    lightboxImg.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialPinchDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      } else if (e.touches.length === 1 && currentScale > 1) {
        isDragging = true;
        startX = e.touches[0].clientX - translateX;
        startY = e.touches[0].clientY - translateY;
      }
    });

    lightboxImg.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialPinchDistance) {
        e.preventDefault();
        const currentDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = currentDist / initialPinchDistance;
        currentScale = Math.min(Math.max(currentScale * factor, 1), 5);
        initialPinchDistance = currentDist;
        applyTransform();
      } else if (e.touches.length === 1 && isDragging) {
        e.preventDefault();
        translateX = e.touches[0].clientX - startX;
        translateY = e.touches[0].clientY - startY;
        applyTransform();
      }
    }, { passive: false });

    lightboxImg.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) initialPinchDistance = null;
      if (e.touches.length === 0) isDragging = false;
    });

    // =========================================================================
    // Emoji Picker & Input Controls
    // =========================================================================
    const emojiToggleBtn = document.getElementById('emojiToggleBtn');
    const emojiPicker = document.getElementById('emojiPicker');
    const messageInput = document.getElementById('messageInput');

    emojiToggleBtn.addEventListener('click', () => emojiPicker.classList.toggle('hidden'));

    document.querySelectorAll('.emoji-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        messageInput.value += btn.textContent;
        emojiPicker.classList.add('hidden');
        messageInput.focus();
      });
    });

    // =========================================================================
    // JSONBin Backend Sync Logic
    // =========================================================================
    async function syncWithJSONBin() {
      if (!JSONBIN_BIN_ID || JSONBIN_BIN_ID === "YOUR_BIN_ID_HERE") return;

      try {
        const res = await fetch(JSONBIN_URL + '/latest', {
          headers: { 'X-Master-Key': JSONBIN_API_KEY }
        });

        if (res.ok) {
          const json = await res.json();
          if (json.record) {
            if (json.record.messages) {
              if (JSON.stringify(localStoreData.messages) !== JSON.stringify(json.record.messages)) {
                localStoreData.messages = json.record.messages;
                localStorage.setItem('bou_chat_messages', JSON.stringify(localStoreData.messages));
                renderAllMessages();
              }
            }

            if (json.record.notices) {
              if (JSON.stringify(localStoreData.notices) !== JSON.stringify(json.record.notices)) {
                localStoreData.notices = json.record.notices;
                localStorage.setItem('bou_chat_notices', JSON.stringify(localStoreData.notices));
                renderAllNotices();
              }
            }

            if (json.record.users) {
              localStoreData.users = json.record.users;
              localStorage.setItem('bou_chat_users', JSON.stringify(localStoreData.users));
            }
          }
        }
      } catch (e) { console.warn('Sync warning:', e); }
    }

    async function saveToJSONBin() {
      if (!JSONBIN_BIN_ID || JSONBIN_BIN_ID === "YOUR_BIN_ID_HERE") return;
      try {
        await fetch(JSONBIN_URL, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': JSONBIN_API_KEY
          },
          body: JSON.stringify(localStoreData)
        });
      } catch (e) { console.error('Save failed:', e); }
    }

    // Advanced Image Compression for Faster & Error-free Cloud Uploads
    function compressImage(file, maxWidth = 500, quality = 0.45) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width; 
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    }

    function showLoading(show, text = "Loading...") {
      const el = document.getElementById('loadingOverlay');
      document.getElementById('loadingText').textContent = text;
      if (show) el.classList.remove('hidden');
      else el.classList.add('hidden');
    }

    // =========================================================================
    // Admin Delete Modal & Actions
    // =========================================================================
    document.getElementById('closeDeleteModalBtn').addEventListener('click', () => {
      document.getElementById('adminDeleteModal').classList.add('hidden');
    });

    document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
      const pass = document.getElementById('adminPasswordInput').value.trim();
      const adminStatus = document.getElementById('adminStatus');

      if (pass !== ADMIN_PASSWORD_DEFAULT) {
        adminStatus.textContent = 'Invalid admin password!';
        adminStatus.className = 'status-msg error';
        return;
      }

      if (pendingDeleteTarget) {
        if (pendingDeleteTarget.type === 'chat') {
          localStoreData.messages = localStoreData.messages.filter(m => m.id !== pendingDeleteTarget.id);
          localStorage.setItem('bou_chat_messages', JSON.stringify(localStoreData.messages));
          renderAllMessages();
        } else if (pendingDeleteTarget.type === 'notice') {
          localStoreData.notices = localStoreData.notices.filter(n => n.id !== pendingDeleteTarget.id);
          localStorage.setItem('bou_chat_notices', JSON.stringify(localStoreData.notices));
          renderAllNotices();
        }

        await saveToJSONBin();
        document.getElementById('adminDeleteModal').classList.add('hidden');
        pendingDeleteTarget = null;
      }
    });

    function attachLongPressListener(element, msgId) {
      let timer = null;
      const start = () => {
        timer = setTimeout(() => {
          pendingDeleteTarget = { type: 'chat', id: msgId };
          document.getElementById('deleteModalTitle').textContent = 'Delete Message (Admin)';
          document.getElementById('adminPasswordInput').value = '';
          document.getElementById('adminStatus').textContent = '';
          document.getElementById('adminDeleteModal').classList.remove('hidden');
        }, 600);
      };
      const stop = () => { if (timer) clearTimeout(timer); };

      element.addEventListener('touchstart', start);
      element.addEventListener('touchend', stop);
      element.addEventListener('touchmove', stop);
      element.addEventListener('mousedown', start);
      element.addEventListener('mouseup', stop);
      element.addEventListener('mouseleave', stop);
    }

    // =========================================================================
    // Chat Message Rendering & Actions
    // =========================================================================
    function renderAllMessages() {
      const messageArea = document.getElementById('messageArea');
      messageArea.innerHTML = '';

      if (localStoreData.messages && localStoreData.messages.length > 0) {
        localStoreData.messages.forEach(renderMessage);
      } else {
        messageArea.innerHTML = '<div style="text-align:center; color: var(--text-secondary); font-size:13px; margin-top:30px;">Welcome to Lounge Chat! Start messaging below.</div>';
      }
      scrollToBottom();
    }

    function renderMessage(msg) {
      const messageArea = document.getElementById('messageArea');
      if (document.getElementById(msg.id)) return;

      const isMine = currentUser && msg.sender_id === currentUser.id;

      const row = document.createElement('div');
      row.id = msg.id;
      row.className = `msg-row ${isMine ? 'sent' : 'received'}`;

      const senderUser = localStoreData.users.find(u => u.id === msg.sender_id);
      const avatarSrc = msg.sender_avatar || (senderUser ? senderUser.avatar : null);
      
      let avatarHtml = '';
      if (!isMine) {
        if (avatarSrc) {
          avatarHtml = `<img src="${avatarSrc}" class="msg-avatar" alt="pic" />`;
        } else {
          const init = msg.sender_name ? msg.sender_name.substring(0,2).toUpperCase() : 'U';
          avatarHtml = `<div class="msg-avatar">${init}</div>`;
        }
      }

      const senderName = isMine ? 'You' : escapeHtml(msg.sender_name || 'User');
      const timeStr = msg.created_at ? new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

      let contentHtml = '';
      if (msg.message_text) { contentHtml += `<div>${escapeHtml(msg.message_text)}</div>`; }
      if (msg.image_url) { contentHtml += `<img src="${msg.image_url}" class="msg-img" onclick="openLightbox('${msg.image_url}')" />`; }

      row.innerHTML = `
        ${avatarHtml}
        <div class="msg-content-wrapper">
          <div class="msg-sender">${senderName}</div>
          <div class="msg-bubble">
            ${contentHtml}
            <div class="msg-time">${timeStr}</div>
          </div>
        </div>
      `;

      attachLongPressListener(row, msg.id);
      messageArea.appendChild(row);
    }

    document.getElementById('attachBtn').addEventListener('click', () => {
      document.getElementById('imageInput').click();
    });

    document.getElementById('imageInput').addEventListener('change', async function () {
      const file = this.files[0];
      if (!file) return;

      if (file.size > MAX_FILE_SIZE_BYTES) {
        alert("File size exceeds 10 MB Limit.");
        this.value = '';
        return;
      }

      showLoading(true, "Compressing & Uploading image...");

      try {
        const compressedBase64 = await compressImage(file, 500, 0.45);
        await sendNewMessage('', compressedBase64);
      } catch (err) {
        alert("Failed to send image.");
      } finally {
        showLoading(false);
        this.value = '';
      }
    });

    document.getElementById('sendBtn').addEventListener('click', () => {
      const text = messageInput.value.trim();
      if (text) {
        sendNewMessage(text, null);
        messageInput.value = '';
      }
    });

    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const text = messageInput.value.trim();
        if (text) {
          sendNewMessage(text, null);
          messageInput.value = '';
        }
      }
    });

    async function sendNewMessage(text, imageUrl) {
      if (!currentUser) return;

      const newMsg = {
        id: 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        sender_id: currentUser.id,
        sender_name: currentUser.name || 'Guest',
        sender_avatar: currentUser.avatar || null,
        message_text: text,
        image_url: imageUrl,
        created_at: new Date().toISOString()
      };

      localStoreData.messages.push(newMsg);
      localStorage.setItem('bou_chat_messages', JSON.stringify(localStoreData.messages));
      
      renderMessage(newMsg);
      scrollToBottom();

      await saveToJSONBin();
    }

    function scrollToBottom() {
      const messageArea = document.getElementById('messageArea');
      messageArea.scrollTop = messageArea.scrollHeight;
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // =========================================================================
    // PWA & Install App Logic
    // =========================================================================
    let deferredPrompt;
    const installAppBtn = document.getElementById('installAppBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installAppBtn.classList.remove('hidden');
    });

    installAppBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          console.log('User accepted prompt');
        }
        deferredPrompt = null;
        installAppBtn.classList.add('hidden');
      }
    });

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          console.log('ServiceWorker registered with scope: ', reg.scope);
        }).catch((err) => {
          console.log('ServiceWorker registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>
